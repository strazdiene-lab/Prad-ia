<title>Europos žemėlapis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: control panel on the left, square map on the right; stacked on phones */
:root{
  --sea:#dbe6ea; --land:#eef0e4; --coast:#7f8f86; --border:#b3baa8; --grat:#c9d6db;
  --bg:#f4f6f5; --panel:#ffffff; --fg:#1d2a2e; --muted:#5d6b6f; --line:#d8dfdf;
  --accent:#1f5f7a; --accent-fg:#ffffff; --accent-soft:#dcebf1;
  --ok:#2e7d4a; --ok-soft:#dff0e4; --bad:#c2412d; --bad-soft:#f8e1dc;
  --river:#2f7fb8; --mount:#9a5b2c; --hl:#e0861a;
  --f-display:"Fraunces", Georgia, serif; --f-body:"Manrope", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f1b21; --land:#25302d; --coast:#6d8079; --border:#47534f; --grat:#1c2a31;
  --bg:#0c1316; --panel:#141e22; --fg:#e4ecec; --muted:#93a3a6; --line:#2a383d;
  --accent:#6fb4d3; --accent-fg:#0c1316; --accent-soft:#18323e;
  --ok:#5cc282; --ok-soft:#173326; --bad:#f07a63; --bad-soft:#3a1d18;
  --river:#5aa9e0; --mount:#d39a62; --hl:#f2a443; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f1b21; --land:#25302d; --coast:#6d8079; --border:#47534f; --grat:#1c2a31;
  --bg:#0c1316; --panel:#141e22; --fg:#e4ecec; --muted:#93a3a6; --line:#2a383d;
  --accent:#6fb4d3; --accent-fg:#0c1316; --accent-soft:#18323e;
  --ok:#5cc282; --ok-soft:#173326; --bad:#f07a63; --bad-soft:#3a1d18;
  --river:#5aa9e0; --mount:#d39a62; --hl:#f2a443; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;max-width:1400px;margin:0 auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;box-sizing:border-box}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);padding:9px 6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.cats{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.cat:hover{background:var(--accent-soft)}
.cat input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.cat span{flex:1}
.cat small{color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--f-body);padding:10px 14px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.cat:focus-within,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--accent);font:600 13px var(--f-body);cursor:pointer;padding:0}
select{font:600 14px var(--f-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.prompt{background:var(--accent-soft);border-radius:10px;padding:14px}
.prompt .tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt .name{font-family:var(--f-display);font-size:26px;line-height:1.15;margin-top:4px;text-wrap:balance}
.prompt .hint{font-size:13px;color:var(--muted);margin-top:6px}
.progress{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.fb{border-radius:10px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--fg);margin-top:2px}
.list{max-height:46vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:1px}
.list h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:700}
.item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:400 14px var(--f-body);padding:5px 8px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--hl);color:#1a1205;font-weight:600}
.score{font-family:var(--f-display);font-size:44px;line-height:1}
.mist{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto}
.mist div{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding:4px 0}
.mist em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mapwrap{position:relative;min-width:0}
.map{width:100%;aspect-ratio:1/1;max-width:100%;max-height:calc(100dvh - 32px);display:block;margin:0 auto;background:var(--sea);border-radius:12px;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.mapwrap.learn .map{cursor:pointer}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 18px var(--f-body);cursor:pointer}
.maphint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:6px}
svg .land{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
svg .borders{fill:none;stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
svg .grat{fill:none;stroke:var(--grat);stroke-width:.5;vector-effect:non-scaling-stroke}
svg .area{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
svg .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
svg .ln.river{stroke:var(--river);stroke-width:2.5}
svg .ln.mount{stroke:var(--mount);stroke-width:5;opacity:.6}
svg .dot{fill:var(--accent);stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
svg .hl .area{fill:var(--hl);fill-opacity:.3;stroke:var(--hl);stroke-dasharray:none;stroke-width:2}
svg .hl .ln{stroke:var(--hl);opacity:1;stroke-width:5}
svg .hl .dot{fill:var(--hl)}
svg .ans .area{fill:var(--ok);fill-opacity:.22;stroke:var(--ok);stroke-dasharray:none;stroke-width:2}
svg .ans .ln{stroke:var(--ok);opacity:1;stroke-width:5}
svg .ans .dot{fill:var(--ok)}
svg .click{stroke:var(--panel);stroke-width:2;vector-effect:non-scaling-stroke}
svg .click.ok{fill:var(--ok)} svg .click.bad{fill:var(--bad)}
svg .lbl{fill:var(--fg);font-family:var(--f-body);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="app">
  <aside class="panel" id="panel"></aside>
  <div class="mapwrap" id="mapwrap">
    <svg class="map" id="map" viewBox="0 0 1000 1000" role="img" aria-label="Europos kontūrinis žemėlapis">
      <g id="vp">
        <path class="grat" id="grat"></path>
        <path class="land" id="land"></path>
        <path class="borders" id="borders"></path>
        <g id="items"></g>
        <g id="answer"></g>
      </g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Priartinti">+</button>
      <button id="zout" aria-label="Nutolinti">−</button>
      <button id="zreset" aria-label="Visas žemėlapis">⤢</button>
    </div>
    <div class="maphint" id="maphint">Ratuku arba pirštais priartinkite, tempkite – paslinkite</div>
  </div>
</div>

I.forEach((it,i)=>it.id=i);
const CATNAME = Object.fromEntries(CATS);
const R = 6371;

// ---------- Map ----------
const svg = d3.select("#map"), vp = d3.select("#vp");
const proj = d3.geoAzimuthalEqualArea().rotate([-15,-54]).scale(MAP.scale).translate(MAP.translate).clipExtent([[0,0],[1000,1000]]);
const gpath = d3.geoPath(proj);
d3.select("#land").attr("d", MAP.land);
d3.select("#borders").attr("d", MAP.borders);
d3.select("#grat").attr("d", gpath(d3.geoGraticule().step([10,10])()));
let K = 1;
const zoom = d3.zoom().scaleExtent([1,14]).translateExtent([[0,0],[1000,1000]])
  .on("zoom", e => { vp.attr("transform", e.transform); K = e.transform.k; rescale(); });
svg.call(zoom).on("dblclick.zoom", null);
function rescale(){
  vp.selectAll(".dot").attr("r", 4.5/K);
  vp.selectAll(".click").attr("r", 6/K);
  vp.selectAll(".lbl").attr("font-size", 13/K).style("stroke-width", 3/K+"px");
}
d3.select("#zin").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,1.6));
d3.select("#zout").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6));
d3.select("#zreset").on("click",()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity));

function geomOf(it){
  if(it.p) return d3.geoCircle().center(it.p).radius(it.r/111.19)();
  return {type:"LineString",coordinates:it.l};
}
function lineClass(it){ return it.c==="upes"||it.c==="kanalai" ? "ln river" : it.c==="kalnai"||it.c==="lygumos" ? "ln mount" : "ln"; }
function labelPos(it){ return it.p ? it.p : it.l[Math.floor(it.l.length/2)]; }
function drawItem(g, it, withLabel){
  const s = g.append("g").attr("data-id", it.id);
  if(it.p){
    s.append("path").attr("class","area").attr("d", gpath(geomOf(it)));
    const [x,y] = proj(it.p); s.append("circle").attr("class","dot").attr("cx",x).attr("cy",y);
  } else {
    s.append("path").attr("class", lineClass(it)).attr("d", gpath(geomOf(it)));
  }
  if(withLabel){
    const [x,y] = proj(labelPos(it));
    s.append("text").attr("class","lbl").attr("x",x).attr("y",y).attr("dy","-0.6em").attr("text-anchor","middle").text(it.n);
  }
  return s;
}
// atstumas km nuo taško iki objekto
const dense = new Map();
function densify(it){
  if(dense.has(it.id)) return dense.get(it.id);
  const pts=[];
  for(let i=0;i<it.l.length-1;i++){
    const a=it.l[i], b=it.l[i+1], d=d3.geoDistance(a,b)*R, n=Math.max(1,Math.ceil(d/5)), f=d3.geoInterpolate(a,b);
    for(let j=0;j<n;j++) pts.push(f(j/n));
  }
  pts.push(it.l[it.l.length-1]); dense.set(it.id,pts); return pts;
}
function distTo(ll, it){
  if(it.p) return d3.geoDistance(ll,it.p)*R;
  let m=Infinity; for(const q of densify(it)) m=Math.min(m,d3.geoDistance(ll,q)*R); return m;
}
function edgeDist(ll,it){ return it.p ? Math.max(0, distTo(ll,it)-it.r) : Math.max(0,distTo(ll,it)-it.r); }
function eventLonLat(e){
  const [x,y] = d3.pointer(e, svg.node());
  const t = d3.zoomTransform(svg.node());
  return proj.invert(t.invert([x,y]));
}
function zoomTo(it){
  const [[x0,y0],[x1,y1]] = gpath.bounds(geomOf(it));
  const w=Math.max(x1-x0,40), h=Math.max(y1-y0,40), cx=(x0+x1)/2, cy=(y0+y1)/2;
  const k=Math.min(8, 0.6*1000/Math.max(w,h)), kk=Math.max(1,k);
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(500-kk*cx,500-kk*cy).scale(kk));
}

// ---------- State ----------
const S = { mode:"learn", cats:new Set(CATS.map(c=>c[0])), count:"20", showLabels:true, sel:null,
  q:[], idx:0, score:0, answered:false, mistakes:[], screen:"setup" };
try{ const sv=JSON.parse(localStorage.getItem("eu-quiz")||"null"); if(sv){ S.mode=sv.mode||S.mode; S.count=sv.count||S.count; if(Array.isArray(sv.cats)&&sv.cats.length) S.cats=new Set(sv.cats.filter(c=>CATNAME[c])); } }catch(e){}
function save(){ try{ localStorage.setItem("eu-quiz", JSON.stringify({mode:S.mode,count:S.count,cats:[...S.cats]})); }catch(e){} }
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pool = () => I.filter(it=>S.cats.has(it.c));

function render(){
  document.getElementById("mapwrap").classList.toggle("learn", S.screen==="learn");
  if(S.screen==="setup") renderSetup();
  else if(S.screen==="learn") renderLearn();
  else if(S.screen==="test") renderTest();
  else renderResult();
}

function renderSetup(){
  d3.select("#items").selectAll("*").remove(); d3.select("#answer").selectAll("*").remove();
  const n = pool().length;
  panel.innerHTML = `
    <div><h1>Europos žemėlapis</h1><p class="sub">Jūros, sąsiauriai, salos, kalnai, upės ir kiti objektai iš sąrašo.</p></div>
    <div class="seg" role="group" aria-label="Režimas">
      <button id="mLearn" aria-pressed="${S.mode==="learn"}">Mokymasis</button>
      <button id="mTest" aria-pressed="${S.mode==="test"}">Testas</button>
    </div>
    <p class="sub">${S.mode==="learn" ? "Žemėlapyje matysi visus pasirinktų kategorijų objektus. Spausk pavadinimą sąraše arba objektą žemėlapyje." : "Bus parodytas objekto pavadinimas – spausk toje žemėlapio vietoje, kur jis yra."}</p>
    <div class="row" style="justify-content:space-between"><h2>Kategorijos</h2>
      <span class="row"><button class="linkbtn" id="all">Visos</button><button class="linkbtn" id="none">Nė vienos</button></span></div>
    <div class="cats">${CATS.map(([k,l])=>`<label class="cat"><input type="checkbox" id="c-${k}" value="${k}" ${S.cats.has(k)?"checked":""}><span>${l}</span><small>${I.filter(i=>i.c===k).length}</small></label>`).join("")}</div>
    ${S.mode==="test" ? `<div class="row"><label for="cnt">Klausimų:</label><select id="cnt">${["10","20","30","all"].map(v=>`<option value="${v}" ${S.count===v?"selected":""}>${v==="all"?"Visi ("+n+")":v}</option>`).join("")}</select></div>`:""}
    <button class="btn primary" id="go" ${n?"":"disabled"}>${S.mode==="learn"?"Pradėti mokytis":"Pradėti testą"} · ${n} obj.</button>`;
  panel.querySelector("#mLearn").onclick=()=>{S.mode="learn";save();render();};
  panel.querySelector("#mTest").onclick=()=>{S.mode="test";save();render();};
  panel.querySelector("#all").onclick=()=>{S.cats=new Set(CATS.map(c=>c[0]));save();render();};
  panel.querySelector("#none").onclick=()=>{S.cats.clear();save();render();};
  panel.querySelectorAll(".cat input").forEach(cb=>cb.onchange=()=>{cb.checked?S.cats.add(cb.value):S.cats.delete(cb.value);save();render();});
  const cnt=panel.querySelector("#cnt"); if(cnt) cnt.onchange=()=>{S.count=cnt.value;save();render();};
  panel.querySelector("#go").onclick=()=> S.mode==="learn" ? startLearn() : startTest(pool());
  drawPreview();
}
function drawPreview(){
  const g=d3.select("#items"); g.selectAll("*").remove();
  if(S.mode==="learn") pool().forEach(it=>drawItem(g,it,false));
  rescale();
}

// ---------- Learn ----------
function startLearn(){ S.screen="learn"; S.sel=null; render(); }
function renderLearn(){
  const items=pool();
  panel.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>Mokymasis</h2><button class="linkbtn" id="back">← Nustatymai</button></div>
    <div class="prompt" id="selbox">${S.sel!=null?`<div class="tag">${esc(CATNAME[I[S.sel].c])}</div><div class="name">${esc(I[S.sel].n)}</div>`:`<div class="tag">Pasirink objektą</div><div class="hint">Spausk pavadinimą sąraše arba objektą žemėlapyje.</div>`}</div>
    <label class="cat"><input type="checkbox" id="lbls" ${S.showLabels?"checked":""}><span>Rodyti pavadinimus žemėlapyje</span></label>
    <button class="btn" id="totest">Pasitikrinti šias kategorijas testu</button>
    <div class="list">${CATS.filter(([k])=>S.cats.has(k)).map(([k,l])=>`<h3>${l}</h3>`+items.filter(i=>i.c===k).map(i=>`<button class="item ${S.sel===i.id?"on":""}" data-id="${i.id}">${esc(i.n)}</button>`).join("")).join("")}</div>`;
  panel.querySelector("#back").onclick=()=>{S.screen="setup";render();};
  panel.querySelector("#lbls").onchange=e=>{S.showLabels=e.target.checked;drawLearn();};
  panel.querySelector("#totest").onclick=()=>{S.mode="test";save();startTest(pool());};
  panel.querySelectorAll(".item").forEach(b=>b.onclick=()=>select(+b.dataset.id,true));
  drawLearn();
}
function drawLearn(){
  const g=d3.select("#items"); g.selectAll("*").remove(); d3.select("#answer").selectAll("*").remove();
  pool().forEach(it=>{ if(it.id!==S.sel) drawItem(g,it,S.showLabels); });
  if(S.sel!=null) drawItem(g,I[S.sel],true).classed("hl",true);
  rescale();
}
function select(id,zoomIt){
  S.sel=id;
  const box=panel.querySelector("#selbox");
  box.innerHTML=`<div class="tag">${esc(CATNAME[I[id].c])}</div><div class="name">${esc(I[id].n)}</div>`;
  panel.querySelectorAll(".item").forEach(b=>b.classList.toggle("on",+b.dataset.id===id));
  const on=panel.querySelector(".item.on"); if(on && !zoomIt) on.scrollIntoView({block:"nearest"});
  drawLearn(); if(zoomIt) zoomTo(I[id]);
}

// ---------- Test ----------
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startTest(items, keepAll){
  let q=shuffle(items);
  if(!keepAll && S.count!=="all") q=q.slice(0,+S.count);
  Object.assign(S,{screen:"test",q,idx:0,score:0,answered:false,mistakes:[],last:null});
  d3.select("#items").selectAll("*").remove();
  svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);
  render();
}
function renderTest(){
  const it=S.q[S.idx], tot=S.q.length;
  d3.select("#answer").selectAll("*").remove();
  panel.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>Testas</h2><button class="linkbtn" id="back">← Baigti</button></div>
    <div><div class="progress"><span>Klausimas ${S.idx+1} iš ${tot}</span><span>Teisingai: ${S.score}</span></div>
      <div class="bar"><i style="width:${S.idx/tot*100}%"></i></div></div>
    <div class="prompt"><div class="tag">${esc(CATNAME[it.c])}</div><div class="name">${esc(it.n)}</div>
      <div class="hint">Spausk žemėlapyje, kur yra šis objektas.</div></div>
    <div id="fb"></div>
    <div class="row"><button class="btn primary" id="next" disabled>${S.idx+1<tot?"Toliau":"Rezultatai"}</button>
      <button class="btn" id="skip">Nežinau</button></div>`;
  panel.querySelector("#back").onclick=()=>{S.screen="result";render();};
  panel.querySelector("#next").onclick=next;
  panel.querySelector("#skip").onclick=()=>answer(null);
}
function answer(ll){
  if(S.answered) return; S.answered=true;
  const it=S.q[S.idx], a=d3.select("#answer");
  const d = ll ? distTo(ll,it) : null, ok = ll!=null && d<=it.r;
  drawItem(a,it,true).classed("ans",true);
  if(ll){ const [x,y]=proj(ll); a.append("circle").attr("class","click "+(ok?"ok":"bad")).attr("cx",x).attr("cy",y); }
  rescale();
  if(ok) S.score++; else S.mistakes.push({it, km: ll? Math.round(edgeDist(ll,it)) : null});
  const fb=panel.querySelector("#fb");
  fb.innerHTML = ok ? `<div class="fb ok">Teisingai!</div>`
    : `<div class="fb bad">${ll?"Neteisingai":"Praleista"}<small>${ll?`Tavo spustelėjimas nutolęs ~${Math.round(edgeDist(ll,it))} km nuo objekto. `:""}Teisinga vieta pažymėta žaliai.</small></div>`;
  panel.querySelector("#skip").disabled=true;
  const nb=panel.querySelector("#next"); nb.disabled=false; nb.focus({preventScroll:true});
  const [[x0,y0],[x1,y1]]=gpath.bounds(geomOf(it)), t=d3.zoomTransform(svg.node());
  const [vx0,vy0]=t.apply([x0,y0]), [vx1,vy1]=t.apply([x1,y1]);
  if(vx1<0||vy1<0||vx0>1000||vy0>1000) zoomTo(it);
}
function next(){
  if(!S.answered) return;
  S.idx++; S.answered=false;
  if(S.idx>=S.q.length){ S.screen="result"; render(); } else renderTest();
}
function renderResult(){
  d3.select("#answer").selectAll("*").remove();
  const done=S.idx+(S.answered?1:0), tot=Math.max(1,Math.min(done,S.q.length)), pct=Math.round(S.score/tot*100);
  panel.innerHTML = `
    <h2>Rezultatas</h2>
    <div><div class="score">${S.score} / ${done}</div><p class="sub">${done?pct+" % teisingai":"Neatsakyta nė į vieną klausimą"}</p></div>
    ${S.mistakes.length?`<div><h2 style="margin-bottom:6px">Klaidos (${S.mistakes.length})</h2><div class="mist">${S.mistakes.map(m=>`<div><span>${esc(m.it.n)}</span><em>${m.km!=null?"~"+m.km+" km":"praleista"}</em></div>`).join("")}</div></div>`:(done?`<div class="fb ok">Be klaidų!</div>`:"")}
    <div class="row">
      ${S.mistakes.length?`<button class="btn primary" id="redo">Kartoti klaidas</button>`:""}
      <button class="btn ${S.mistakes.length?"":"primary"}" id="again">Naujas testas</button>
      <button class="btn" id="setup">Nustatymai</button>
    </div>`;
  const g=d3.select("#items"); g.selectAll("*").remove();
  S.mistakes.forEach(m=>drawItem(g,m.it,true).classed("hl",true)); rescale();
  const r=panel.querySelector("#redo"); if(r) r.onclick=()=>startTest(S.mistakes.map(m=>m.it),true);
  panel.querySelector("#again").onclick=()=>startTest(pool());
  panel.querySelector("#setup").onclick=()=>{S.screen="setup";render();};
}

// ---------- Map clicks ----------
svg.on("click", e=>{
  const ll=eventLonLat(e); if(!ll) return;
  if(S.screen==="test"){ answer(ll); }
  else if(S.screen==="learn"){
    let best=null,bs=Infinity;
    for(const it of pool()){ const s=distTo(ll,it)/Math.max(it.r,25); if(s<bs){bs=s;best=it;} }
    if(best && bs<=1.3) select(best.id,false);
  }
});
document.addEventListener("keydown", e=>{
  if(S.screen==="test" && S.answered && (e.key==="Enter"||e.key===" ") && document.activeElement?.id!=="next"){ e.preventDefault(); next(); }
});
render();
</script>
